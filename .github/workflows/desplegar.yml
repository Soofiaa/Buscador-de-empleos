name: Probar y desplegar

# Solo con push a main (nunca pull_request): el runner es el PC de Sofia y no debe ejecutar código de terceros.
on:
  push:
    branches: [main]

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: [self-hosted, windows, jobtracker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Entorno de pruebas
        shell: pwsh
        run: |
          $venv = Join-Path $env:JT_RUNNER_DIR "venv"
          if (-not (Test-Path "$venv\Scripts\python.exe")) { & $env:JT_PYTHON -m venv $venv }
          & "$venv\Scripts\python.exe" -m pip install -q -r requirements.txt

      - name: Pruebas
        shell: pwsh
        run: |
          & "$env:JT_RUNNER_DIR\venv\Scripts\python.exe" -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Desplegar
        shell: pwsh
        run: ./scripts/desplegar_auto.ps1
